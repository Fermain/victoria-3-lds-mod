l_english:
 lds_utah_gathering:0 "The Gathering to Zion"
 lds_utah_territory:0 "Utah Territory Governance"
 lds_federal_crackdown:0 "Federal Crackdown on Deseret"
 lds_events.2.t:0 "The Exodus to the West"
 lds_events.2.d:0 "Facing continued persecution in the East, Brigham Young and the Council of Twelve have announced a great migration to the Great Salt Lake Valley. They call it Zion - a place where the Saints can live in peace."
 lds_events.2.a:0 "Let them go."
 lds_events.3.t:0 "The State of Deseret"
 lds_events.3.d:0 "The Mormon settlers in the West have petitioned Congress for statehood under the name Deseret. Their proposed borders are immense, covering much of the Mexican Cession. The question of their peculiar institutions also weighs heavily on the debate."
 lds_events.3.a:0 "Establish the Utah Territory instead."
 lds_events.3.b:0 "Recognize Deseret as a self-governing Dominion."
 lds_events.3.c:0 "Reject their claims outright. Send the army."
